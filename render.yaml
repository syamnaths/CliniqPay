services:
  - type: web
    name: cliniqpay
    env: python
    region: singapore # Close to India users for optimal low-latency UPI cashier responses
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn cliniqpay.wsgi:application --bind 0.0.0.0:$PORT --workers 3"
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.6
      - key: DJANGO_SETTINGS_MODULE
        value: cliniqpay.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: cliniqpay-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"

databases:
  - name: cliniqpay-db
    plan: free
    region: singapore
    databaseName: cliniqpay
    user: cliniqpay_user
