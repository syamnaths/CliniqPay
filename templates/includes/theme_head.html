<script>
  // Tailwind dark mode configuration with safe guard if tailwind hasn't loaded yet
  if (typeof tailwind !== 'undefined') {
    tailwind.config = {
      darkMode: 'class',
    };
  } else {
    window.tailwind = {
      config: { darkMode: 'class' }
    };
  }

  // Global CliniqPay Dark/Light Theme Script
  (function() {
    if (localStorage.getItem('cliniqpay-theme') === 'dark' || (!('cliniqpay-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  })();

  function toggleGlobalTheme() {
    const isDark = document.documentElement.classList.contains('dark');
    if (isDark) {
      document.documentElement.classList.remove('dark');
      localStorage.setItem('cliniqpay-theme', 'light');
    } else {
      document.documentElement.classList.add('dark');
      localStorage.setItem('cliniqpay-theme', 'dark');
    }
    updateAllThemeIcons();
  }

  function updateAllThemeIcons() {
    const isDark = document.documentElement.classList.contains('dark');
    document.querySelectorAll('.globalThemeIcon').forEach(icon => {
      icon.innerText = isDark ? 'light_mode' : 'dark_mode';
    });
  }

  document.addEventListener('DOMContentLoaded', updateAllThemeIcons);
</script>
